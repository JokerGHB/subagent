<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>多 Agent 调研系统</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>🔍 多 Agent 调研系统</h1>
        <p>规划 → 并行搜索 → 抽取 → 分析 → 报告 · SQLite 历史 + Redis 缓存</p>
      </header>

      <div class="card">
        <div class="row">
          <input
            id="topic"
            type="text"
            placeholder="输入调研主题，如：国产大模型市场分析"
            value=""
          />
          <label class="force"
            ><input id="force" type="checkbox" /> 强制刷新（忽略缓存）</label
          >
          <button id="submitBtn" onclick="submit()">开始调研</button>
        </div>
        <div id="status" class="status"></div>
        <div id="progressBox" class="progress hidden">
          <div class="bar"><div id="barFill" class="bar-fill"></div></div>
          <div class="progress-text">
            <span id="progressLabel"></span>
            <span id="progressEta"></span>
          </div>
        </div>
        <div id="err" class="err hidden"></div>
        <div id="report" class="report hidden"></div>
      </div>

      <div class="card">
        <h2 class="section">📚 我的调研历史（点击查看报告）</h2>
        <div id="history"></div>
      </div>

      <div class="card">
        <h2 class="section">🔥 全站热门 Top10</h2>
        <div id="hot-history"></div>
      </div>

      <div class="card">
        <h2 class="section">🛠 管理员入口</h2>
        <div class="row">
          <input id="adminToken" type="password" placeholder="管理员令牌" />
          <input id="adminTopic" type="text" placeholder="按主题过滤（可选）" />
          <button onclick="loadAdmin(true)">查询全量历史</button>
        </div>
        <div id="adminInfo" class="status"></div>
        <div id="adminBody" class="hidden"></div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);

      // 访客 ID：localStorage 生成一次，之后复用。同浏览器=同一人（个人历史归属）
      // crypto.randomUUID 只在安全上下文（HTTPS / localhost）可用：
      // 公网 IP 走纯 HTTP 时它是 undefined，必须降级。访客 ID 只需唯一稳定，不必是真 UUID。
      function genVisitorId() {
        if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
          return crypto.randomUUID();
        }
        return "v-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
      }
      function getVisitorId() {
        let id = localStorage.getItem("research_visitor_id");
        if (!id) {
          id = genVisitorId();
          localStorage.setItem("research_visitor_id", id);
        }
        return id;
      }

      async function api(path, opts) {
        const headers = {
          "X-User-Id": getVisitorId(),
          ...(opts && opts.headers),
        };
        const res = await fetch(path, { ...opts, headers });
        if (!res.ok) {
          let detail = "请求失败";
          try {
            detail = (await res.json()).detail || detail;
          } catch (_) {}
          throw new Error(detail);
        }
        return res;
      }

      // 极简 Markdown 渲染：标题 / 列表 / 粗体 / 链接，够演示用
      function inline(s) {
        return s
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          // [文字](链接) → 真链接。之前只认 **加粗**，链接被当普通文字整串显示，
          // 报告里每处 [来源](https://…) 都露出一条长 URL（含中文被百分号编码后的
          // %E9%A2%84…，看着就像乱码），而且点不动。
          // URL 来自外部网页（不可信）：只认 http(s)，并把 " 转义成 %22，
          // 否则带双引号的 URL 能从 href 里逃逸出去注入属性。
          .replace(
            /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
            (m, text, url) =>
              `<a href="${url.replace(/"/g, "%22")}" target="_blank" rel="noopener noreferrer">` +
              `${urlLabel(text)}</a>`
          );
      }

      // 附录里 writer 按 prompt 写的是 [URL](URL)：链接文字本身就是 URL，其中中文被
      // 百分号编码（/blog/idc%E9%A2%84%E6%B5%8B… 其实是 /blog/idc预测…）。解回中文、
      // 超长截断，否则一长串 %E9%A2%84 看着就是乱码。解码可能还原出 < >，解完再转义一次。
      function urlLabel(text) {
        if (!/^https?:\/\//i.test(text)) return text;
        // 进来的文字已被 esc() 转义过，先还原成原始字符再解码，避免二次转义
        let s = text.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">");
        try {
          s = decodeURIComponent(s);
        } catch (e) {
          /* 非法百分号序列（如 stray %）：原样显示，别把整行搞坏 */
        }
        s = s.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        return s.length > 70 ? s.slice(0, 70) + "…" : s;
      }
      function renderMarkdown(md) {
        const esc = (s) =>
          s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        let html = "",
          inList = false;
        const close = () => {
          if (inList) {
            html += "</ul>";
            inList = false;
          }
        };
        for (const raw of md.split("\n")) {
          const t = raw.trim();
          if (t.startsWith("### ")) {
            close();
            html += `<h3>${inline(esc(t.slice(4)))}</h3>`;
          } else if (t.startsWith("## ")) {
            close();
            html += `<h2>${inline(esc(t.slice(3)))}</h2>`;
          } else if (t.startsWith("# ")) {
            close();
            html += `<h1>${inline(esc(t.slice(2)))}</h1>`;
          } else if (t.startsWith("- ")) {
            if (!inList) {
              html += "<ul>";
              inList = true;
            }
            html += `<li>${inline(esc(t.slice(2)))}</li>`;
          } else if (t === "") {
            close();
          } else {
            close();
            html += `<p>${inline(esc(t))}</p>`;
          }
        }
        close();
        return html;
      }

      function showReport(md) {
        $("report").innerHTML = renderMarkdown(md || "（报告为空）");
        $("report").classList.remove("hidden");
      }
      function showErr(msg) {
        $("err").textContent = "⚠ " + msg;
        $("err").classList.remove("hidden");
      }

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      // 轮询间隔：GET /research/{id} 只读一个内存字典，很便宜；1.2s 才像"实时"。
      // 后端进度是【估算】（按阶段耗时先验算），不是精确比例，所以文案写「约」。
      const POLL_MS = 1200;

      function showProgress(p) {
        if (!p) return;
        $("progressBox").classList.remove("hidden");
        const pct = Math.max(0, Math.min(100, p.percent || 0));
        const fill = $("barFill");
        fill.style.width = pct + "%";
        // 失败态给红条：进度条走满但颜色说明「是结束了，不是成功了」
        fill.className = "bar-fill" + (p.stage === "failed" ? " failed" : "");
        $("progressLabel").textContent = `${pct}% · ${p.label || ""}`;
        const elapsed = `已用 ${Math.round(p.elapsed || 0)}s`;
        $("progressEta").textContent = p.eta
          ? `预计还需约 ${Math.round(p.eta)}s · ${elapsed}`
          : elapsed;
      }
      function hideProgress() {
        $("progressBox").classList.add("hidden");
        $("barFill").style.width = "0%";
        $("barFill").className = "bar-fill";
      }

      async function submit() {
        const topic = $("topic").value.trim();
        const force = $("force").checked;
        $("err").classList.add("hidden");
        $("report").classList.add("hidden");
        hideProgress();
        if (topic.length < 2) {
          showErr("主题至少 2 个字");
          return;
        }
        $("submitBtn").disabled = true;
        $("status").textContent = "发起调研…";

        try {
          const res = await api("/research", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ topic, force }),
          });
          const { job_id } = await res.json();

          // 轮询直到 done / error
          for (;;) {
            await sleep(POLL_MS);
            const s = await (await api(`/research/${job_id}`)).json();
            showProgress(s.progress);
            const sum =
              s.facts !== undefined
                ? `（来源 ${s.sources} · 事实 ${s.facts} · 关键点 ${s.key_points}）`
                : "";
            $("status").textContent = `状态：${s.status}${sum}`;
            if (s.status === "done") break;
            if (s.status === "error") throw new Error(s.error || "调研失败");
          }
          const md = await (await api(`/research/${job_id}/result`)).text();
          showReport(md);
          $("status").textContent = "✅ 完成（结果已写入 SQLite 历史）";
          loadHistory();
        } catch (e) {
          // 进度条留着并标红（失败也是一次"结束"），失败原因在 err 里显式说明
          showErr(e.message);
          $("status").textContent = "";
        } finally {
          $("submitBtn").disabled = false;
        }
      }

      // 状态标签：class 用英文状态名（对应 style.css 配色），文案显示中文。
      // 「失败」要一眼可辨 —— 失败记录是保留的，点开能看到失败原因而不是空白。
      const STATUS_LABEL = {
        written: "完成",
        failed: "失败",
        empty: "无结果",
        error: "失败",
      };
      function statusTag(status) {
        return `<span class="tag ${status}">${STATUS_LABEL[status] || status}</span>`;
      }

      function renderHistoryItem(r) {
        const tag = statusTag(r.status);
        // created_at 是 UTC 存储，new Date 自动转本地时区显示
        const time = new Date(r.created_at).toLocaleString("zh-CN", {
          hour12: false,
        });
        const facts = r.summary ? r.summary.facts : 0;
        const views = r.view_count != null ? ` · 👁 ${r.view_count}` : "";
        const meta = `${time} · 事实 ${facts}${views}${tag}`;
        return `<div class="history-item" onclick="openHistory('${r.id}')">
          <span class="topic">${r.topic}</span>
          <span class="meta">${meta}</span>
        </div>`;
      }

      function renderEmpty(selector, text) {
        $(selector).innerHTML =
          `<p style="color:#57606a;font-size:13px">${text}</p>`;
      }

      async function loadHistory() {
        const el = $("history");
        try {
          // api() 自动带 X-User-Id → 后端只返回当前访客的记录
          const rows = await (await api("/history")).json();
          if (!rows.length) {
            renderEmpty("history", "暂无你的调研记录，去上面发起一次吧");
            return;
          }
          el.innerHTML = rows.map(renderHistoryItem).join("");
        } catch (e) {
          el.innerHTML = `<p style="color:#cf222e;font-size:13px">历史加载失败：${e.message}</p>`;
        }
      }

      async function loadHot() {
        const el = $("hot-history");
        try {
          const rows = await (await api("/history/hot")).json();
          if (!rows.length) {
            renderEmpty("hot-history", "暂无调研记录");
            return;
          }
          el.innerHTML = rows
            .map((r, i) => {
              const tag = statusTag(r.status);
              const views = r.view_count != null ? `👁 ${r.view_count}` : "";
              const num = `${i + 1}`;
              return `<div class="history-item" onclick="openHistory('${r.id}')">
                <span class="topic">${num} ${r.topic}</span>
                <span class="meta">${views}${tag}</span>
              </div>`;
            })
            .join("");
        } catch (e) {
          el.innerHTML = `<p style="color:#cf222e;font-size:13px">热门加载失败：${e.message}</p>`;
        }
      }

      // ---- 管理员 ----
      let adminOffset = 0;
      const ADMIN_PAGE = 20;

      function adminAuthHeader() {
        const token = $("adminToken").value.trim();
        return token ? { Authorization: `Bearer ${token}` } : {};
      }

      function pageAdmin(delta) {
        adminOffset = Math.max(0, adminOffset + delta * ADMIN_PAGE);
        loadAdmin(false);
      }

      async function loadAdmin(reset) {
        if (reset) adminOffset = 0;
        const topic = $("adminTopic").value.trim();
        try {
          const q = new URLSearchParams({
            offset: adminOffset,
            limit: ADMIN_PAGE,
          });
          if (topic) q.set("topic", topic);
          const data = await (
            await api(`/admin/history?${q}`, { headers: adminAuthHeader() })
          ).json();
          // 删除本页最后一条后可能停在空页 → 钳制回上一页（避免显示"第 3/2 页"）
          if (adminOffset >= data.total && adminOffset > 0) {
            adminOffset = Math.max(0, adminOffset - ADMIN_PAGE);
          }
          const pages = Math.max(1, Math.ceil(data.total / ADMIN_PAGE));
          const page = Math.floor(adminOffset / ADMIN_PAGE) + 1;
          $("adminInfo").textContent =
            `共 ${data.total} 条 · 第 ${page}/${pages} 页`;
          if (!data.items.length) {
            $("adminBody").innerHTML =
              '<p style="color:#57606a;font-size:13px">没有匹配的记录</p>';
          } else {
            $("adminBody").innerHTML =
              data.items
                .map((r) => {
                  const owner = r.user_id
                    ? r.user_id.slice(0, 8) + "…"
                    : "公共";
                  const time = new Date(r.created_at).toLocaleString("zh-CN", {
                    hour12: false,
                  });
                  const tag = statusTag(r.status);
                  return `<div class="history-item" onclick="openHistory('${r.id}')">
                  <span class="topic">${r.topic} <span style="color:#57606a;font-size:12px">[${owner}]</span></span>
                  <span class="meta">${time} · 👁 ${r.view_count || 0}${tag}
                    <button class="btn-danger" onclick="event.stopPropagation(); adminDelete('${r.id}')">删除</button>
                  </span>
                </div>`;
                })
                .join("") +
              `<div class="row" style="margin-top:12px">
                <button onclick="pageAdmin(-1)" ${adminOffset === 0 ? "disabled" : ""}>上一页</button>
                <button onclick="pageAdmin(1)" ${adminOffset + ADMIN_PAGE >= data.total ? "disabled" : ""}>下一页</button>
              </div>`;
          }
          $("adminBody").classList.remove("hidden");
        } catch (e) {
          $("adminBody").classList.remove("hidden");
          $("adminBody").innerHTML =
            `<p style="color:#cf222e;font-size:13px">${e.message}</p>`;
        }
      }

      async function adminDelete(id) {
        if (!confirm("确定删除这条历史记录吗？此操作不可恢复。")) return;
        try {
          await api(`/admin/history/${id}`, {
            method: "DELETE",
            headers: adminAuthHeader(),
          });
          loadAdmin(false); // 刷新当前页
          loadHot(); // 热门可能变化
        } catch (e) {
          alert("删除失败：" + e.message);
        }
      }

      async function openHistory(id) {
        $("err").classList.add("hidden");
        hideProgress(); // 历史回看没有正在跑的任务，进度条不该留在页面上
        try {
          const md = await (await api(`/research/${id}/result`)).text();
          showReport(md);
          window.scrollTo({ top: 0, behavior: "smooth" });
          loadHot(); // 刚打开过一次 → 热门计数可能变化，顺手刷新
        } catch (e) {
          showErr(e.message);
        }
      }

      loadHistory();
      loadHot();
    </script>
  </body>
</html>
